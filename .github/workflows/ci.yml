name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Initialize isolated database
        env:
          STARTER_DATABASE_URL: postgres://starter:starter@127.0.0.1:5432/starter_test?sslmode=disable
        run: |
          go run . setup --config /tmp/starter-ci-config.yaml
          go run . db-init --config /tmp/starter-ci-config.yaml
          go run . db-status --config /tmp/starter-ci-config.yaml
          go run . db-up --config /tmp/starter-ci-config.yaml
      - name: Install pinned GoFrame generation tool
        run: make tools
      - name: HTTP, migration, generated module and worker integration
        env:
          STARTER_TEST_DATABASE_URL: postgres://starter:starter@127.0.0.1:5432/starter_test?sslmode=disable
          STARTER_TEST_REDIS_ADDRESS: 127.0.0.1:6379
          STARTER_TEST_GF: ${{ github.workspace }}/.tools/gf
        run: make test-integration
      - run: git diff --check
