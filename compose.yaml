services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_POSTGRES_PASSWORD:-starter}
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:${STARTER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${STARTER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
