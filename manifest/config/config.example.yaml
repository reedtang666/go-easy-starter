# Run `make setup` to create config.yaml with independent random keys.
# JSON generated by setup is also valid YAML. Never commit config.yaml.
server:
  address: ":8000"
  baseUrl: "http://localhost:8000"
  development: true
  origins: ["http://localhost:5173"]
  maxBodyBytes: 22020096
  shutdownSeconds: 30
limits:
  authPerMinute: 30
  uploadPerMinute: 60
database:
  url: "postgres://starter:starter@127.0.0.1:5432/starter?sslmode=disable"
redis:
  auth: {address: "127.0.0.1:6379", password: "", db: 1, prefix: "starter:auth:"}
  cache: {address: "127.0.0.1:6379", password: "", db: 2, prefix: "starter:cache:"}
  queue: {address: "127.0.0.1:6379", password: "", db: 3}
auth:
  issuer: go-easy-starter
  audience: starter-api
  register: true
  accessSecretKey: ""
  refreshHashKey: ""
  accessExpires: 900
  refreshIdleExpires: 604800
  refreshAbsoluteExpires: 2592000
  refreshReuseGrace: 5
storage:
  default: local
  maxBytes: 20971520
  linkSeconds: 900
  multipartSeconds: 86400
  allowedTypes: [image/jpeg, image/png, image/gif, image/webp, application/pdf, text/plain, application/zip]
  drivers:
    local:
      enabled: true
      driver: local
      root: storage/uploads
      signingKey: ""
    oss-main:
      enabled: false
      driver: oss
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      bucket: ""
      accessKey: ""
      secretKey: ""
      publicUrl: ""
    cos-main:
      enabled: false
      driver: cos
      endpoint: "" # Complete bucket URL, including scheme.
      bucket: ""
      accessKey: ""
      secretKey: ""
      publicUrl: ""
    qiniu-main:
      enabled: false
      driver: qiniu
      bucket: ""
      accessKey: ""
      secretKey: ""
      publicUrl: "" # Required download domain for both public/private URLs.
    minio-main:
      enabled: false
      driver: minio
      endpoint: "127.0.0.1:9000" # No scheme for MinIO SDK.
      secure: false
      bucket: starter
      accessKey: ""
      secretKey: ""
      publicUrl: ""
    ucloud-main:
      enabled: false
      driver: ucloud
      endpoint: ""
      bucketHost: ""
      fileHost: ""
      bucket: ""
      accessKey: ""
      secretKey: ""
      publicUrl: ""
queue:
  name: default
  concurrency: 10
  maxRetry: 5
  timeoutSeconds: 60
  cleanupCron: "@every 1h"
  timezone: Asia/Shanghai
websocket:
  enabled: false
  ticketSeconds: 60
  maxConnections: 1000
  maxMessageBytes: 65536
  heartbeatSeconds: 30
